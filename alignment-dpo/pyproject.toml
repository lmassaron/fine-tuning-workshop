[project]
name = "alignment-dpo"
version = "0.1.0"
description = "Direct Preference Optimization (DPO) on Qwen2.5-3B using TRL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "trl",
    "peft",
    "accelerate",
    "bitsandbytes",
    "datasets",
    "pandas",
    "numpy",
    "matplotlib",
    "tqdm",
    "jupyter",
    "ipykernel",
]

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu130"]
